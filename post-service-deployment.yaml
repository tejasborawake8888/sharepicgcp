apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-service
  template:
    metadata:
      labels:
        app: post-service
    spec:
      serviceAccountName: sharepic-ksa
      containers:
        - name: post-service
          image: us-east1-docker.pkg.dev/project-7724e29a-0202-4802-903/sharepic-repo/post-service:20261028162646
          ports:
            - containerPort:  8080
          envFrom:
            - secretRef:
                name: sharepic-runtime-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://127.0.0.1:5432/postgres
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          args:
            - "--structured-logs"
            - "--port=5432"
            - "project-7724e29a-0202-4802-903:us-east1:sharepic-1"
          securityContext:
            runAsNonRoot: true
